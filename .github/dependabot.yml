# Dependabot version updates (Jarvis T121, D-77/D-88). This repository has no PR CI,
# so Jarvis reports each update as a card and never auto-merges it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
